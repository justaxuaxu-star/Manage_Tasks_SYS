[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-manager-backend"
version = "0.1.0"
description = "Task Manager API for manage_tasks_sys"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.scripts]
uvicorn = "backend.uvicorn_cli:main"